<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #07080c; overflow: hidden; }
      /* The canvas fills whatever space itch gives it, and the renderer follows the canvas size
         at the display's pixel ratio, so fullscreen is drawn at native resolution. */
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: #07080c; }
      #loading { position: fixed; left: 0; right: 0; top: 46%; text-align: center; color: #d8d4cc;
                 font: 600 18px/1.4 system-ui, Segoe UI, Arial, sans-serif; letter-spacing: 0.08em; pointer-events: none; }
      #bar { width: 240px; height: 4px; margin: 14px auto 0; background: #2a2d36; }
      #fill { width: 0; height: 100%; background: #d8d4cc; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">HOME<div id="bar"><div id="fill"></div></div></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, (progress) => {
        document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
      }).then((unityInstance) => {
        document.querySelector("#loading").remove();
      }).catch((message) => {
        document.querySelector("#loading").textContent = message;
      });
    </script>
  </body>
</html>
